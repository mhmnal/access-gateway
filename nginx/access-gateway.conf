# Access gateway — Nginx front end
#
# The app listens on 127.0.0.1:3000 only. Nginx is the only thing reachable
# from outside, which is the whole point of the proxy layer.

server {
    listen 80;
    server_name gateway.example.edu;

    # Don't advertise the exact Nginx version
    server_tokens off;

    # No uploads on this route — keep the surface small
    client_max_body_size 1m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Never serve dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
}
